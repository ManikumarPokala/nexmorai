services:
  db:
    image: postgres:15
    container_name: nexmorai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexmorai
      POSTGRES_USER: nexmorai
      POSTGRES_PASSWORD: nexmorai
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
